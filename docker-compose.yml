# Deploy: git clone the repo, create .env (see .env.example + APP_PASSWORD), then `docker compose up -d --build`.
# Secrets (OPENAI_API_KEY, APP_PASSWORD) come from the project environment, never from this file.
services:
  reviewlens:
    build: .
    image: reviewlens:latest
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - LLM_PROVIDER=${LLM_PROVIDER:-openai}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o-mini}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - APP_PASSWORD=${APP_PASSWORD:-}
