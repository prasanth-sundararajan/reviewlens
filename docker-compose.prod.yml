# Production override: HTTPS via Caddy, app served under https://<APP_DOMAIN>/<APP_PATH>/,
# app port not exposed publicly.
# Usage on the server (APP_DOMAIN and APP_PATH set in .env):
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
services:
  reviewlens:
    ports: !reset []
    expose:
      - "8501"
    environment:
      - STREAMLIT_SERVER_BASE_URL_PATH=${APP_PATH:-techstack/ReviewLens}

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      - reviewlens
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      - APP_DOMAIN=${APP_DOMAIN:?set APP_DOMAIN in .env}
      - APP_PATH=${APP_PATH:-techstack/ReviewLens}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./sites.d:/etc/caddy/sites.d:ro   # route files of other apps on this server
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
